services:
  - type: web
    name: gooos-studio
    runtime: node
    plan: starter
    # Repo root adalah gooos/ itu sendiri (monorepo pnpm + Turborepo)
    # Build dari root, start dari apps/studio
    buildCommand: npx --yes pnpm@12.8.1 install --frozen-lockfile && npx --yes pnpm@12.8.1 build
    startCommand: npx --yes pnpm@12.8.1 --filter @gooos/studio exec next start -p $PORT -H 0.0.0.0
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      - key: PNPM_VERSION
        value: 12.8.1
      # Wajib isi di Render Dashboard (Environment) — jangan commit value aslinya:
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # OAuth opsional — kosongkan jika belum pakai:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
