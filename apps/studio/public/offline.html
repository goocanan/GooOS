<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <title>GooOS — Sedang Offline</title>
  <link rel="icon" href="/brand/favicon.ico">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrapper img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #e11d48, #4f46e5);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <img src="/brand/icon-192.png" alt="GooOS Logo">
    </div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>Aplikasi GooOS membutuhkan koneksi internet untuk memuat data pesanan, inventaris filamen, dan status armada printer secara real-time.</p>
    <button class="btn" onclick="window.location.reload()">Muat Ulang Halaman</button>
  </div>
</body>
</html>
